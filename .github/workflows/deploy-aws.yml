name: Deploy to AWS

# Deploys on pushes to main that touch the app or infra, or manually:
# Actions tab -> "Deploy to AWS" -> Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "aws_lambda/**"
      - "infra/**"
      - "assets/fonts/**"
      - "assets/icons/**"
      - ".github/workflows/deploy-aws.yml"

permissions:
  id-token: write   # OIDC token for aws-actions/configure-aws-credentials
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  STACK_NAME: weekcalendar
  # Always pass these explicitly: on an existing stack SAM otherwise keeps the
  # values from an earlier deploy instead of the template's new defaults.
  PARAMS: "Design=dense DesignOptions=collapse+month_column+upcoming+tomorrow+evening+advice RenderDays=14 EnableSchedule=false"
  SAM_CLI_TELEMETRY: "0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run handler tests
        run: |
          python -m pip install -r infra/requirements-lambda.txt boto3 "moto[s3,ssm]" pytest
          python -m pytest tests -q

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Not a secret: only GitHub Actions runs of this repo on main can assume it.
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::241455051821:role/weekcalendar-bootstrap-DeployRole-ckiWIIv7zDen' }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate template
        run: sam validate --lint -t infra/template.yaml

      - name: Build
        run: sam build -t infra/template.yaml

      - name: Deploy
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --resolve-image-repos \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides $PARAMS \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Show outputs
        run: |
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" --output table

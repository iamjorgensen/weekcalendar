AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  weekcalendar - renders an 800x480 calendar image for an Inky Frame on request
  (the frame calls image.png?fresh=1 when it wakes) and serves it over a Lambda
  Function URL. Optional nightly pre-render. Deploy in eu-west-1.

Conditions:
  ScheduleEnabled: !Equals [!Ref EnableSchedule, "true"]

Parameters:
  EnableSchedule:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Also render on a fixed daily schedule. Not needed when the frame requests
      image.png?fresh=1 (it then triggers the render itself).
  RenderHour:
    Type: Number
    Default: 3
    MinValue: 0
    MaxValue: 23
    Description: Hour (Europe/Oslo) of the optional daily render (EnableSchedule=true).
  RenderMinute:
    Type: Number
    Default: 30
    MinValue: 0
    MaxValue: 59
    Description: Minute of the daily render.
  ScheduleTimezone:
    Type: String
    Default: Europe/Oslo
  ParameterPath:
    Type: String
    Default: weekcalendar
    AllowedPattern: "[A-Za-z0-9_.-]+"
    Description: SSM Parameter Store path (without slashes) holding config and secrets.
  RenderDays:
    Type: Number
    Default: 14
    Description: Number of days fetched for the calendar (the design shows as many as fit).
  Design:
    Type: String
    Default: dense
    AllowedValues: [hero, dense, agenda, band, legacy]
    Description: Layout of the calendar image (legacy = the original Pi layout).
  DesignOptions:
    Type: String
    Default: "collapse+month_column+upcoming+tomorrow+evening+advice"
    Description: >
      Extras for the dense design, '+'-separated: collapse (repeated all-day events
      once), month (mini calendar), tomorrow ("I morgen"), evening (after 17:00 the big
      panel shows tomorrow), advice (clothing advice), morning (08:00 temperature).

Globals:
  Function:
    Architectures: [x86_64]
    Environment:
      Variables:
        BUCKET_NAME: !Ref ImageBucket
        PARAM_PREFIX: !Sub "/${ParameterPath}/"

Resources:
  # ---------------------------------------------------------------- storage
  ImageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadedLetters
            Status: Enabled
            Prefix: inbox/
            ExpirationInDays: 30

  ImageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImageBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ImageBucket.Arn
              - !Sub "${ImageBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ---------------------------------------------------------------- render
  RenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-render"
      Description: Fetch calendar/weather data, render the image, upload to S3.
      PackageType: Image
      Timeout: 60
      MemorySize: 1024
      EphemeralStorage:
        Size: 512
      Environment:
        Variables:
          RENDER_DAYS: !Ref RenderDays
          DESIGN: !Ref Design
          DESIGN_OPTIONS: !Ref DesignOptions
          WORK_DIR: /tmp/weekcalendar
          GS_CACHE_PATH: /tmp/weekcalendar/cache/event_mappings_cache.json
          # The mappings cache is only used when the Google Sheet fetch fails;
          # a stale copy beats the built-in fallback, so keep it valid for 30 days.
          GS_CACHE_TTL_SECONDS: "2592000"
          AI_ICON_CACHE_PATH: /tmp/weekcalendar/cache/ai_icon_cache.json
          ICONS_CACHE_DIR: /tmp/weekcalendar/icons
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadWriteImagesAndCaches
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource:
                - !Sub "${ImageBucket.Arn}/latest/*"
                - !Sub "${ImageBucket.Arn}/cache/*"
            - Sid: ReadAdminConfig
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub "${ImageBucket.Arn}/config/*"
                - !Sub "${ImageBucket.Arn}/log/dinner.json"
            - Sid: ListCache
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ImageBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: ["cache/*"]
            - Sid: ReadConfig
              Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ParameterPath}/*"
            - Sid: DecryptSecureStringsViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
    Metadata:
      Dockerfile: infra/Dockerfile
      DockerContext: ..
      DockerTag: python3.12-v1

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ingest"
      Description: Read an uploaded school letter with Claude (Bedrock) and write events to Google Calendar.
      PackageType: Image
      ImageConfig:
        Command: ["ingest_handler.handler"]
      Timeout: 70
      MemorySize: 512
      Environment:
        Variables:
          BEDROCK_REGION: !Ref AWS::Region
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadUploads
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub "${ImageBucket.Arn}/inbox/*"
                - !Sub "${ImageBucket.Arn}/config/*"
            - Sid: LettersLog
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${ImageBucket.Arn}/log/*"
            - Sid: ReadConfig
              Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ParameterPath}/*"
            - Sid: DecryptSecureStringsViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Sid: ClaudeOnBedrock
              Effect: Allow
              Action: bedrock-mantle:CreateInference
              Resource: "*"
    Metadata:
      Dockerfile: infra/Dockerfile
      DockerContext: ..
      DockerTag: python3.12-v1

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${IngestFunction}"
      RetentionInDays: 14

  RenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RenderFunction}"
      RetentionInDays: 14

  SchedulerRole:
    Type: AWS::IAM::Role
    Condition: ScheduleEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokeRender
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RenderFunction.Arn

  DailyRenderSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: ScheduleEnabled
    Properties:
      Name: !Sub "${AWS::StackName}-daily-render"
      Description: Render the calendar image before the frame's nightly fetch.
      ScheduleExpression: !Sub "cron(${RenderMinute} ${RenderHour} * * ? *)"
      ScheduleExpressionTimezone: !Ref ScheduleTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt RenderFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"source": "schedule"}'
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 1800

  # ---------------------------------------------------------------- serve
  ServeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-serve"
      Description: Function URL for the Inky Frame (image, status, render trigger).
      PackageType: Zip
      Runtime: python3.12
      CodeUri: ../aws_lambda/
      Handler: serve_handler.handler
      # Long enough for ?fresh=1, which waits for a full render (max 60 s).
      Timeout: 75
      MemorySize: 256
      Environment:
        Variables:
          RENDER_FUNCTION_NAME: !Ref RenderFunction
          INGEST_FUNCTION_NAME: !Ref IngestFunction
          DESIGN_OPTIONS: !Ref DesignOptions
          FRESH_RENDER_TIMEOUT: "65"
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ReadImages
              Effect: Allow
              Action: s3:GetObject
              Resource: !Sub "${ImageBucket.Arn}/latest/*"
            - Sid: ListLatest   # so a missing image is "NoSuchKey" (404), not AccessDenied
              Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt ImageBucket.Arn
              Condition:
                StringLike:
                  s3:prefix: ["latest/*"]
            - Sid: ReadFrameAndAdminParams
              Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ParameterPath}/FRAME_TOKEN"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ParameterPath}/ADMIN_TOKEN"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ParameterPath}/CHILDREN"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ParameterPath}/CHILDREN_SCHOOL_YEAR"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ParameterPath}/CALENDAR_FEEDS"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ParameterPath}/SPOND_EMAIL"
                - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ParameterPath}/SPOND_PASSWORD"
            - Sid: AdminConfig
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${ImageBucket.Arn}/config/*"
            - Sid: AdminReadLogs
              Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub "${ImageBucket.Arn}/log/*"
                - !Sub "${ImageBucket.Arn}/cache/feeds_sync.json"
                - !Sub "${ImageBucket.Arn}/cache/frame_seen.json"
            - Sid: DecryptSecureStringsViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Sid: TriggerRender
              Effect: Allow
              Action: lambda:InvokeFunction
              Resource:
                - !GetAtt RenderFunction.Arn
                - !GetAtt IngestFunction.Arn
            - Sid: StoreUploads
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "${ImageBucket.Arn}/inbox/*"

  # ---------------------------------------------------------------- watchdog
  WatchdogFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-watchdog"
      Description: Daily push alert (ntfy) if the frame stops updating or its battery is low.
      PackageType: Zip
      Runtime: python3.12
      CodeUri: ../aws_lambda/
      Handler: watchdog_handler.handler
      Timeout: 30
      MemorySize: 128
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: FrameState
              Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource:
                - !Sub "${ImageBucket.Arn}/cache/frame_seen.json"
                - !Sub "${ImageBucket.Arn}/cache/watchdog.json"
            - Sid: NtfyTopic
              Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ParameterPath}/NTFY_TOPIC"
            - Sid: DecryptSecureStringsViaSsm
              Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-watchdog"
            ScheduleExpression: "cron(0 12 * * ? *)"
            ScheduleExpressionTimezone: Europe/Oslo

  WatchdogLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${WatchdogFunction}"
      RetentionInDays: 14

  ServeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ServeFunction}"
      RetentionInDays: 14

Outputs:
  FunctionUrl:
    Description: Base URL for the frame. Image = <FunctionUrl>image.png?token=<FRAME_TOKEN>
    Value: !GetAtt ServeFunctionUrl.FunctionUrl
  BucketName:
    Description: Private S3 bucket holding latest/ images and cache/
    Value: !Ref ImageBucket
  RenderFunctionName:
    Value: !Ref RenderFunction
  ServeFunctionName:
    Value: !Ref ServeFunction
